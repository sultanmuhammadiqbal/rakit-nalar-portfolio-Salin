name: Portfolio checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check source contracts
        run: npm test
      - name: Astro type and template checks
        run: npm run check
      - name: Build static site
        run: npm run build
      - name: Confirm output files
        run: |
          test -f dist/index.html
          test -f dist/work/ruang-reka/index.html
          grep -q 'noindex,nofollow' dist/index.html
          grep -q 'noindex,nofollow' dist/work/ruang-reka/index.html
      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Chromium responsive and accessibility audit
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > /tmp/rakit-nalar-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/homepage-browser.mjs
      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rakit-nalar-p2-responsive-audit
          path: artifacts/screenshots/
          if-no-files-found: warn
      - name: Upload compiled preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: rakit-nalar-static-preview
          path: dist/
          if-no-files-found: error
